<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排隊小高手｜雙人數學對戰</title>
<style>
:root{--ink:#24304a;--purple:#7657d6;--pink:#ff7196;--blue:#45a7e8;--yellow:#ffd65a;--mint:#5bd6b0;--paper:#fffdf7}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#dff7ff,#f7eaff 55%,#fff4cf);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:800;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.04);transform:translateY(-2px)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.wrap{max-width:1100px;margin:auto;padding:20px}
header{text-align:center;padding:8px 0 16px}
h1{font-size:clamp(2rem,5vw,3.3rem);margin:4px 0;color:#4f3caa;text-shadow:2px 3px 0 white}
.subtitle{font-weight:700;color:#59627b}
.pill{display:inline-block;background:white;padding:7px 13px;border-radius:999px;box-shadow:0 3px 0 #d7d4ed;font-size:.92rem;margin:4px}
.panel{background:rgba(255,255,255,.94);border:3px solid white;border-radius:24px;padding:20px;box-shadow:0 10px 28px #554a8b18;margin:14px 0}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:800;display:block;margin-bottom:6px}
input[type=text]{width:100%;padding:12px;border:2px solid #e0dcf7;border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--purple)}
.primary{background:var(--purple);color:white;box-shadow:0 4px 0 #4d399b}
.secondary{background:#edf0ff;color:#51429a}
.next{background:var(--mint);color:#124c3c;box-shadow:0 4px 0 #28a782}
.danger{background:#ffe5ed;color:#a52c54}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.player{border-radius:18px;padding:14px;text-align:center;border:3px solid transparent;background:#f2f7ff}
.player.active{border-color:var(--yellow);box-shadow:0 0 0 4px #ffd65a45}
.player.p2{background:#fff0f5}
.player .name{font-size:1.15rem;font-weight:900}
.score{font-size:2.2rem;font-weight:1000;line-height:1.2}
.vs{display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:1000;color:#9b75d9}
.meter{height:10px;background:#eceaf8;border-radius:99px;overflow:hidden;margin-top:8px}
.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .3s}
.gamehead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.progress{font-weight:900;color:#6653b7}
.question{font-size:clamp(1.2rem,3vw,1.7rem);font-weight:900;line-height:1.55;margin:16px 0}
.queue-visual{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:18px 0;min-height:66px;align-items:center}
.person{width:48px;height:58px;border-radius:14px;background:#edf2ff;border:2px solid #dce3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.45rem;position:relative}
.person small{font-size:.7rem;font-weight:900;color:#555c77}
.person.highlight{background:#fff0b7;border-color:#ffca3a;transform:translateY(-3px)}
.person.pink{background:#ffe3ed;border-color:#ffb5cd}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{background:#f0edff;color:#43377f;border:2px solid #ded7ff;font-size:1.15rem;min-height:56px}
.answer.correct{background:#d7ffec;border-color:#42c79b;color:#126a4c}
.answer.wrong{background:#ffe0e8;border-color:#ff779b;color:#9f2449}
.feedback{padding:14px;border-radius:14px;font-weight:800;margin-top:14px;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.good{background:#ddfff0;color:#126747}
.feedback.bad{background:#fff0d4;color:#80501b}
.controls{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.small{font-size:.9rem;color:#68708a}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule{background:#f8f6ff;border-radius:15px;padding:12px}
.rule b{display:block;color:#6650bb;margin-bottom:4px}
.hidden{display:none!important}
.result{text-align:center;padding:24px}
.trophy{font-size:4rem}
.result h2{font-size:2rem;color:#5542b2}
@media(max-width:650px){.wrap{padding:12px}.setup{grid-template-columns:1fr}.scoreboard{gap:6px}.player{padding:10px 6px}.score{font-size:1.8rem}.answers{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.panel{padding:14px}.person{width:39px;height:51px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="pill">🧠 小二數學思維</div><div class="pill">⚔️ 兩人輪流對戰</div>
  <h1>🚦 排隊小高手</h1>
  <div class="subtitle">看清前後位置，動動腦筋，成為排隊解難王！</div>
</header>

<section class="panel" id="setupPanel">
  <h2>🎮 對戰設定</h2>
  <div class="setup">
    <div><label for="name1">🔵 玩家一名稱</label><input id="name1" type="text" value="藍隊小勇士" maxlength="12"></div>
    <div><label for="name2">🌸 玩家二名稱</label><input id="name2" type="text" value="粉紅隊長" maxlength="12"></div>
  </div>
  <div class="rules" style="margin-top:16px">
    <div class="rule"><b>① 輪流作答</b><span>每題由畫面提示的玩家回答。</span></div>
    <div class="rule"><b>② 答對得分</b><span>答對得 10 分，答錯不扣分。</span></div>
    <div class="rule"><b>③ 一起學習</b><span>答錯會顯示解題提示，再交給下一位。</span></div>
  </div>
  <div style="text-align:center;margin-top:18px"><button class="primary" id="startBtn">開始對戰！🚀</button></div>
</section>

<section id="gamePanel" class="hidden">
  <div class="panel">
    <div class="scoreboard">
      <div class="player active" id="playerCard1"><div>🔵</div><div class="name" id="displayName1">藍隊小勇士</div><div class="score" id="score1">0</div><div>分</div><div class="meter"><span id="meter1"></span></div></div>
      <div class="vs">VS</div>
      <div class="player p2" id="playerCard2"><div>🌸</div><div class="name" id="displayName2">粉紅隊長</div><div class="score" id="score2">0</div><div>分</div><div class="meter"><span id="meter2"></span></div></div>
    </div>
  </div>
  <div class="panel">
    <div class="gamehead"><span class="progress" id="progress">第 1 / 20 題</span><span class="pill" id="turnPill">🔵 藍隊作答</span></div>
    <div class="question" id="questionText"></div>
    <div class="queue-visual" id="queueVisual"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="controls"><span class="small" id="hint">小提示：先找出題目說的是「由前數」還是「由後數」。</span><button class="next hidden" id="nextBtn">下一題 ➜</button></div>
  </div>
</section>

<section class="panel hidden result" id="resultPanel">
  <div class="trophy" id="trophy">🏆</div><h2 id="resultTitle">對戰完成！</h2><p id="resultText"></p>
  <div class="scoreboard" style="max-width:560px;margin:18px auto">
    <div class="player"><div class="name" id="finalName1"></div><div class="score" id="finalScore1">0</div><div>分</div></div>
    <div class="vs">VS</div>
    <div class="player p2"><div class="name" id="finalName2"></div><div class="score" id="finalScore2">0</div><div>分</div></div>
  </div>
  <p id="learningSummary"></p><button class="primary" id="restartBtn">再玩一次！🔁</button>
</section>
<div class="small" style="text-align:center;padding:8px 0 20px">小提醒：排隊題要留意「前面第幾個」、「後面第幾個」和「兩人之間有多少人」的分別。</div>
</div>
<script>
const questions = [
{q:"小明排在隊伍的第 4 個，從前面數。他前面有多少人？",opts:["3 人","4 人","5 人","6 人"],a:0,why:"第 4 個代表前面有 3 人。位置數減 1：4 − 1 = 3。",type:"前後位置"},
{q:"小美從隊伍後面數是第 3 個。她後面有多少人？",opts:["1 人","2 人","3 人","4 人"],a:1,why:"從後面數第 3 個，表示她後面有 2 人。3 − 1 = 2。",type:"前後位置"},
{q:"一行有 9 位同學，小樂從前面數第 2，從後面數他是第幾個？",opts:["第 6 個","第 7 個","第 8 個","第 9 個"],a:2,why:"前面第 2，前面有 1 人；全隊 9 人，所以後面有 7 人，他從後面數是第 8 個。",type:"前後位置"},
{q:"排隊時，小華前面有 5 人，後面有 3 人。隊伍共有多少人？",opts:["8 人","9 人","10 人","7 人"],a:1,why:"總人數 = 前面 5 人 + 小華 1 人 + 後面 3 人 = 9 人。",type:"總人數"},
{q:"隊伍共有 10 人，小安從前面數第 6 個。從後面數是第幾個？",opts:["第 4 個","第 5 個","第 6 個","第 7 個"],a:1,why:"從前後兩邊數同一人，位置相加再減 1 等於總人數。10 − 6 + 1 = 5。",type:"前後位置"},
{q:"小文前面有 2 人，小文後面有 6 人。小文從前面數第幾個？",opts:["第 2 個","第 3 個","第 6 個","第 9 個"],a:1,why:"前面有 2 人，小文本人是第 3 個。",type:"前後位置"},
{q:"小明排第 3，小強排第 7（都是由前面數）。他們中間有多少人？",opts:["2 人","3 人","4 人","5 人"],a:1,why:"第 4、5、6 個在他們中間，共 3 人。用 7 − 3 − 1 = 3。",type:"中間人數"},
{q:"隊伍共有 8 人，小玲從後面數第 4 個。她從前面數第幾個？",opts:["第 4 個","第 5 個","第 6 個","第 8 個"],a:1,why:"從前面數的位置 = 8 − 4 + 1 = 第 5 個。",type:"前後位置"},
{q:"小宇從前面數第 5，從後面數第 4。隊伍共有多少人？",opts:["7 人","8 人","9 人","10 人"],a:1,why:"總人數 = 前面位置 + 後面位置 − 1 = 5 + 4 − 1 = 8 人。",type:"總人數"},
{q:"一隊有 7 人，小晴排在最前面。她後面有多少人？",opts:["5 人","6 人","7 人","8 人"],a:1,why:"最前面的小晴後面還有其餘 6 人。7 − 1 = 6。",type:"總人數"},
{q:"排隊共有 12 人，小東從前面數第 8 個。他前面有多少人？",opts:["7 人","8 人","4 人","5 人"],a:0,why:"從前面數第 8 個，前面有 8 − 1 = 7 人。",type:"前後位置"},
{q:"小芳前面有 4 人，後面也有 4 人。隊伍共有多少人？",opts:["8 人","9 人","10 人","7 人"],a:1,why:"4 + 小芳 1 人 + 4 = 9 人。",type:"總人數"},
{q:"小傑第 2 個，小美第 6 個（由前面數）。兩人中間有多少人？",opts:["2 人","3 人","4 人","5 人"],a:1,why:"第 3、4、5 個在中間，共 3 人。6 − 2 − 1 = 3。",type:"中間人數"},
{q:"一行有 11 人，小欣從後面數第 2 個。她從前面數第幾個？",opts:["第 9 個","第 10 個","第 11 個","第 8 個"],a:1,why:"從前面數 = 11 − 2 + 1 = 第 10 個。",type:"前後位置"},
{q:"小明前面有 3 人，小明後面有 5 人。小明從後面數第幾個？",opts:["第 5 個","第 6 個","第 7 個","第 8 個"],a:1,why:"小明後面有 5 人，加上小明自己，從後面數是第 6 個。",type:"前後位置"},
{q:"隊伍共有 9 人，小樂從前面數第 4。小樂後面有多少人？",opts:["4 人","5 人","6 人","3 人"],a:1,why:"前面有 3 人，小樂自己 1 人，後面有 9 − 4 = 5 人。",type:"總人數"},
{q:"小文從前面數第 3，從後面數第 5。隊伍共有多少人？",opts:["6 人","7 人","8 人","9 人"],a:1,why:"3 + 5 − 1 = 7 人。小文被前後兩邊都數到一次，所以要減 1。",type:"總人數"},
{q:"小安排第 4，小晴排第 9（由前面數）。他們中間有多少人？",opts:["3 人","4 人","5 人","6 人"],a:1,why:"第 5、6、7、8 個在中間，共 4 人。9 − 4 − 1 = 4。",type:"中間人數"},
{q:"一隊有 10 人，小明從後面數第 6。他從前面數第幾個？",opts:["第 4 個","第 5 個","第 6 個","第 7 個"],a:1,why:"10 − 6 + 1 = 第 5 個。",type:"前後位置"},
{q:"小美從前面數第 5，小強從後面數第 3。若小美和小強中間有 2 人，隊伍共有多少人？",opts:["8 人","9 人","10 人","11 人"],a:2,why:"小美前面有 4 人；小強後面有 2 人；兩人中間有 2 人；再加兩人自己：4 + 2 + 2 + 2 = 10 人。",type:"綜合思考"}
];
let order=[],idx=0,turn=0,scores=[0,0],names=["藍隊小勇士","粉紅隊長"],answered=false;
const $=id=>document.getElementById(id);
function shuffle(arr){return arr.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);}
function start(){names=[$("name1").value.trim()||"藍隊小勇士",$("name2").value.trim()||"粉紅隊長"];scores=[0,0];idx=0;turn=0;order=shuffle([...questions]);$("setupPanel").classList.add("hidden");$("resultPanel").classList.add("hidden");$("gamePanel").classList.remove("hidden");$("displayName1").textContent=names[0];$("displayName2").textContent=names[1];render();}
function render(){answered=false;let q=order[idx];$("progress").textContent=`第 ${idx+1} / ${order.length} 題　｜　${q.type}`;$("turnPill").textContent=(turn===0?"🔵 ":"🌸 ")+names[turn]+" 作答";$("questionText").textContent=q.q;$("feedback").className="feedback";$("feedback").textContent="";$("nextBtn").classList.add("hidden");$("hint").textContent="小提示：先找出題目說的是「由前數」還是「由後數」。";$("answers").innerHTML="";
q.opts.forEach((o,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=["A","B","C","D"][i]+"　"+o;b.onclick=()=>answer(i,b);$("answers").appendChild(b);});
drawQueue(q);updateScore();}
function drawQueue(q){const box=$("queueVisual");box.innerHTML="";let n=0;if(q.q.includes("隊伍共有 12"))n=12;else if(q.q.includes("一行有 11"))n=11;else if(q.q.includes("共有 10")||q.q.includes("共有 10"))n=10;else if(q.q.includes("共有 9")||q.q.includes("一行有 9"))n=9;else if(q.q.includes("共有 8")||q.q.includes("一行有 8"))n=8;else if(q.q.includes("有 7 人"))n=7;else n=8;
if(n>12)n=12;
for(let i=0;i<n;i++){let d=document.createElement("div");d.className="person"+(i%2?" pink":"");d.innerHTML=`<span>${["🧒","👧","👦","🧑"][i%4]}</span><small>${i+1}</small>`;box.appendChild(d);}
}
function answer(i,btn){if(answered)return;answered=true;let q=order[idx],buttons=[...$("answers").children];buttons.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("correct");});let fb=$("feedback");if(i===q.a){scores[turn]+=10;fb.className="feedback show good";fb.innerHTML="🎉 答對了！+10 分<br>"+q.why;}else{btn.classList.add("wrong");fb.className="feedback show bad";fb.innerHTML="差一點！正確答案是「"+q.opts[q.a]+"」。<br>"+q.why;}
$("hint").textContent="記住方法，再挑戰下一題！";$("nextBtn").classList.remove("hidden");$("nextBtn").textContent=idx===order.length-1?"查看結果 🏆":"下一題 ➜";updateScore();}
function updateScore(){$("score1").textContent=scores[0];$("score2").textContent=scores[1];$("meter1").style.width=(scores[0]/(order.length*10)*100)+"%";$("meter2").style.width=(scores[1]/(order.length*10)*100)+"%";$("playerCard1").classList.toggle("active",turn===0);$("playerCard2").classList.toggle("active",turn===1);}
function next(){if(!answered)return;if(idx===order.length-1){finish();return;}idx++;turn=1-turn;render();}
function finish(){$("gamePanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");$("finalName1").textContent=names[0];$("finalName2").textContent=names[1];$("finalScore1").textContent=scores[0];$("finalScore2").textContent=scores[1];let title,text,trophy;if(scores[0]>scores[1]){title="🔵 "+names[0]+" 勝出！";text="太厲害了！你是排隊思維小高手！";trophy="🏆";}else if(scores[1]>scores[0]){title="🌸 "+names[1]+" 勝出！";text="太厲害了！你是排隊思維小高手！";trophy="🏆";}else{title="🤝 平手！";text="兩位都很棒！再玩一次分出勝負吧！";trophy="🥇🥇";}$("resultTitle").textContent=title;$("resultText").textContent=text;$("trophy").textContent=trophy;$("learningSummary").textContent="解題秘訣：總人數 = 前面人數 + 自己 1 人 + 後面人數；前後位置相加時，記得同一個人被數了兩次，要減 1。";}
$("startBtn").onclick=start;$("nextBtn").onclick=next;$("restartBtn").onclick=()=>{$("resultPanel").classList.add("hidden");$("setupPanel").classList.remove("hidden");$("gamePanel").classList.add("hidden");};
</script>
</body>
</html>
